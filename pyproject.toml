[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "runtoken"
version = "0.1.0"
description = "A blazing-fast BPE tokenizer for LLMs. Drop-in replacement for tiktoken."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["tokenizer", "bpe", "llm", "gpt", "tiktoken", "fast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.maturin]
features = ["python"]
module-name = "runtoken._runtoken"
python-source = "python"
