[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "runtoken"
version = "0.1.2"
description = "A blazing-fast BPE tokenizer for LLMs. Drop-in tiktoken replacement, 20-80x faster."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Thibault Jaigu"}
]
keywords = ["tokenizer", "bpe", "llm", "gpt", "tiktoken", "fast", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/Thibault00/runtoken"
Repository = "https://github.com/Thibault00/runtoken"
Issues = "https://github.com/Thibault00/runtoken/issues"

[tool.maturin]
features = ["python"]
module-name = "runtoken._runtoken"
python-source = "python"
