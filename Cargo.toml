[package]
name = "runtoken"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast BPE tokenizer for LLMs. Drop-in tiktoken replacement, 20-80x faster."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Thibault00/runtoken"
keywords = ["tokenizer", "bpe", "llm", "gpt", "tiktoken"]
categories = ["text-processing", "algorithms"]
authors = ["Thibault Jaigu "]

[lib]
name = "runtoken"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "runtoken-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
fancy-regex = "0.14"
rustc-hash = "2"
lru = "0.12"
rayon = "1.10"
regex = "1.12"
smallvec = "1.15"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "benchmark"
harness = false
